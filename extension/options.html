<!doctype html>
<html>
<head><meta charset="utf-8" /><link rel="stylesheet" href="popup.css" /></head>
<body style="width: 420px">
  <h1>AI Tester settings</h1>
  <label for="apiUrl">API address</label>

  <script src="options.js" type="module"></script>
</body>
</html>
