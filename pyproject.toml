[project]
name = "ai-tester"
version = "0.1.0"
description = "Local AI agent that tests websites in a real browser and reports bugs"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "playwright>=1.63",
    "pydantic>=2.8",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "benchmark/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "browser: launches a real Chrome (headless)",
    "seeded_app: needs the seeded app running (SEEDED_APP_URL) and a local Chrome",
]
