[project]
name = "ai-tester"
version = "0.1.0"
description = "Local AI agent that tests websites in a real browser and reports bugs"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "playwright>=1.50",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["benchmark/tests"]
pythonpath = ["."]
markers = [
    "seeded_app: needs the seeded app running (SEEDED_APP_URL) and a local Chrome",
]
